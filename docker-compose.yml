services:
  app:
    image: ghcr.io/erp-mafia/gnubok:${IMAGE_TAG:-latest}
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - NEXT_PUBLIC_APP_URL
      - CRON_SECRET
      # ── Self-hosted defaults ───────────────────────────────────────────────
      - NEXT_PUBLIC_SELF_HOSTED=${NEXT_PUBLIC_SELF_HOSTED:-true}
      - NEXT_PUBLIC_REQUIRE_MFA=${NEXT_PUBLIC_REQUIRE_MFA:-false}
      # ── Optional: set only what you need ──────────────────────────────────
      - NEXT_PUBLIC_BRANDING_APP_NAME
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY
      - PERSONNUMMER_ENCRYPTION_KEY
      - BANKID_ENCRYPTION_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - RESEND_INBOUND_DOMAIN
      - RESEND_INBOUND_WEBHOOK_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - ENABLE_BANKING_APP_ID
      - ENABLE_BANKING_PRIVATE_KEY
      - ENABLE_BANKING_APP_ID_PRODUCTION
      - ENABLE_BANKING_PRIVATE_KEY_PRODUCTION
      - ENABLE_BANKING_API_URL
      - ENABLE_BANKING_API_URL_PRODUCTION
      - ENABLE_BANKING_PSU_TYPE
      - TIC_IDENTITY_API_KEY
      - TIC_IDENTITY_API_URL
      - TIC_API_PROXY_URL
      - SKATTEVERKET_TOKEN_ENCRYPTION_KEY
      - UPSTASH_REDIS_REST_URL
      - UPSTASH_REDIS_REST_TOKEN
      - SENTRY_DSN
      - GNUBOK_WEBHOOK_SECRET
    # Bound to loopback by default — put a TLS-terminating reverse proxy in
    # front (see docker-compose.caddy.yml). Override PORT in .env to change
    # the host port, or use the caddy overlay to remove the host binding.
    ports:
      - "${PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    init: true
    # tmpfs ordering matters — the parent /app/.next must be mounted before
    # any sub-mounts. The entrypoint cp's image-baked templates into these
    # mounts at startup, then sed-substitutes, then chmod -R a-w.
    #
    # mode=750: root-owned, group-readable. The entrypoint runs as root long
    # enough to copy templates, substitute placeholders, and chown the cache
    # directory to nextjs:nodejs (gid 1001). nodejs group members can read
    # the partially-substituted bundle during startup; nothing else on the
    # host can. After chmod a-w the served files are read-only for everyone.
    tmpfs:
      - /tmp
      - /app/.next:uid=0,gid=1001,mode=750,size=400m
      - /app/public:uid=0,gid=1001,mode=750,size=200m
    mem_limit: 1g
    cpus: 2
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cron:
    build:
      context: docker
      dockerfile: cron.Dockerfile
    depends_on:
      - app
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_URL=http://app:3000
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    pids_limit: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
