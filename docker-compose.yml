services:
  app:
    image: ghcr.io/erp-mafia/gnubok:${IMAGE_TAG:-latest}
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - NEXT_PUBLIC_APP_URL
      - CRON_SECRET
      # ── Self-hosted defaults ───────────────────────────────────────────────
      - NEXT_PUBLIC_SELF_HOSTED=${NEXT_PUBLIC_SELF_HOSTED:-true}
      - NEXT_PUBLIC_REQUIRE_MFA=${NEXT_PUBLIC_REQUIRE_MFA:-false}
      # ── Optional: set only what you need ──────────────────────────────────
      - NEXT_PUBLIC_BRANDING_APP_NAME
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY
      - PERSONNUMMER_ENCRYPTION_KEY
      - BANKID_ENCRYPTION_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - RESEND_API_KEY
      - RESEND_FROM_EMAIL
      - RESEND_INBOUND_DOMAIN
      - RESEND_INBOUND_WEBHOOK_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - ENABLE_BANKING_APP_ID
      - ENABLE_BANKING_PRIVATE_KEY
      - ENABLE_BANKING_APP_ID_PRODUCTION
      - ENABLE_BANKING_PRIVATE_KEY_PRODUCTION
      - ENABLE_BANKING_API_URL
      - ENABLE_BANKING_API_URL_PRODUCTION
      - ENABLE_BANKING_PSU_TYPE
      - TIC_IDENTITY_API_KEY
      - TIC_IDENTITY_API_URL
      - TIC_API_PROXY_URL
      - SKATTEVERKET_TOKEN_ENCRYPTION_KEY
      - UPSTASH_REDIS_REST_URL
      - UPSTASH_REDIS_REST_TOKEN
      - SENTRY_DSN
      - GNUBOK_WEBHOOK_SECRET
    # Bound to loopback by default — put a TLS-terminating reverse proxy in
    # front (see docker-compose.caddy.yml). Override PORT in .env to change
    # the host port, or use the caddy overlay to remove the host binding.
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cron:
    build:
      context: docker
      dockerfile: cron.Dockerfile
    depends_on:
      - app
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - APP_URL=http://app:3000
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
